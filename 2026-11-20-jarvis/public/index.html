<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Jarvis</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <meta name="theme-color" content="#020407">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="console" class="console" data-state="ready" data-expanded="false" aria-label="jarvis console">
    <header class="toprow">
      <label class="sr-only" for="project">project</label>
      <select id="project" class="chip project" title="project"></select>
      <div class="agents" role="radiogroup" aria-label="agent" id="agents"></div>
      <span id="link" class="link" title="bridge connection" aria-label="bridge connection"></span>
      <button id="expand" class="icon-btn" type="button" aria-expanded="false" aria-controls="detail" title="expand transcript (e)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 10v3h3M13 6V3h-3M3 13l4-4M13 3L9 7"/></svg>
      </button>
    </header>

    <section class="stage">
      <button id="ring" class="ring" type="button" aria-describedby="status">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <radialGradient id="core" cx="50%" cy="45%" r="55%">
              <stop offset="0%" class="core-hi"/>
              <stop offset="100%" class="core-lo"/>
            </radialGradient>
          </defs>
          <circle class="r-ticks" cx="60" cy="60" r="56"/>
          <circle class="r-outer" cx="60" cy="60" r="51"/>
          <circle class="r-level" cx="60" cy="60" r="46" pathLength="100"/>
          <g class="orbit"><circle class="r-orbit" cx="60" cy="60" r="41" pathLength="100"/><circle class="r-dot" cx="60" cy="19" r="2.2"/></g>
          <circle class="r-inner" cx="60" cy="60" r="34"/>
          <circle class="r-core" cx="60" cy="60" r="29" fill="url(#core)"/>
        </svg>
      </button>
      <div class="readout">
        <div id="ring-label" class="state-label">ready</div>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </div>
    </section>

    <footer class="preview" id="preview" aria-live="polite">
      <div id="approval-mini" class="approval-mini" hidden>
        <span class="approval-title" id="approval-title"></span>
        <span class="approval-actions">
          <button type="button" class="btn allow" data-decision="allow">allow</button>
          <button type="button" class="btn deny" data-decision="deny">deny</button>
        </span>
      </div>
      <p id="reply-preview" class="reply-preview"></p>
    </footer>

    <section id="detail" class="detail" hidden>
      <div class="session-row">
        <span id="session-label" class="session-label"></span>
        <span class="spacer"></span>
        <button id="stop" type="button" class="btn ghost" disabled title="stop the current run">stop</button>
        <button id="new-session" type="button" class="btn ghost" title="start a fresh session for this project and agent">new session</button>
      </div>
      <ol id="log" class="log" aria-label="conversation"></ol>
      <form id="composer" class="composer" autocomplete="off">
        <label class="sr-only" for="prompt">prompt</label>
        <textarea id="prompt" rows="3" placeholder="your transcript shows up here. edit it or type a prompt" maxlength="8000"></textarea>
        <div class="composer-row">
          <label class="toggle"><input type="checkbox" id="review"> review before sending</label>
          <span class="spacer"></span>
          <button type="submit" class="btn primary" id="send">send</button>
        </div>
      </form>
      <p class="keys">space or enter on the ring to talk, esc to cancel, e to expand, ctrl+enter to send</p>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
