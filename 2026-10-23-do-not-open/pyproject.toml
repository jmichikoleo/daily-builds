[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "do-not-open"
version = "1.0.0"
description = "A creepy-cute macOS desktop mystery. Something lives in the folder."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
do-not-open = "do_not_open.app:main"

[tool.setuptools]
packages = ["do_not_open"]

[tool.pytest.ini_options]
testpaths = ["tests"]
